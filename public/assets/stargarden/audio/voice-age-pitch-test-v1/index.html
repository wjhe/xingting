<main><h1>艾莉 · 三个年龄段试听</h1><blockquote>爸爸，你回来啦！我一直在等你。</blockquote><article><h2>10–13岁 · 童年</h2><p>同一段原声升高2个半音，尽量保持原时长。</p><audio controls preload=metadata src=child-raise-2-semitone.wav></audio></article><article><h2>14–15岁 · 少女</h2><p>原来的16–18岁试听，保持原声音调。</p><audio controls preload=metadata src=../voice-grown-diagnosis-v1/explicit-age.wav></audio></article><article><h2>16–18岁 · 成长</h2><p>同一段原声后期降低1个半音，尽量保持原时长。</p><audio controls preload=metadata src=grown-lower-1-semitone.wav></audio></article>
<small>三个版本都来自同一段录音，后期分别升高2个半音、保持原调、降低1个半音。这里测试的是音高变化，不代表三个年龄已经验收通过。</small></main>
